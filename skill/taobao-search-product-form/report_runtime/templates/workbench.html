    function updateGallery(gallery,{reset=false}={}){const grid=q('[data-gallery-grid]',gallery),entries=qa('.gallery-entry',grid),select=q('[data-gallery-sort]',gallery),key=select.value,selected=select.selectedOptions[0],direction=selected?.dataset.direction==='asc'?1:-1,term=(q('#search')?.value||'').trim().toLowerCase();if(reset)gallery.dataset.page='1';const ordered=[...entries].sort((a,b)=>{if(key==='source')return Number(a.dataset.sourceOrder)-Number(b.dataset.sourceOrder);const av=JSON.parse(a.dataset.sortValues||'{}')[key],bv=JSON.parse(b.dataset.sortValues||'{}')[key];if(av==null&&bv==null)return Number(a.dataset.sourceOrder)-Number(b.dataset.sourceOrder);if(av==null)return 1;if(bv==null)return -1;return (Number(av)-Number(bv))*direction||Number(a.dataset.sourceOrder)-Number(b.dataset.sourceOrder)});ordered.forEach(entry=>grid.appendChild(entry));const matches=ordered.filter(entry=>!term||entry.textContent.toLowerCase().includes(term)),size=Number(gallery.dataset.pageSize)||50,pages=Math.max(1,Math.ceil(matches.length/size)),page=Math.min(pages,Math.max(1,Number(gallery.dataset.page)||1));gallery.dataset.page=String(page);ordered.forEach(entry=>entry.hidden=true);matches.slice((page-1)*size,page*size).forEach(entry=>entry.hidden=false);for(const attr of ['data-gallery-count','data-gallery-count-bottom']){const node=q(`[${attr}]`,gallery);if(node)node.textContent=`${matches.length} 件${term?'匹配商品':''}`};for(const attr of ['data-page-status','data-page-status-bottom']){const node=q(`[${attr}]`,gallery);if(node)node.textContent=`第 ${page} / ${pages} 页`};for(const attr of ['data-page-prev','data-page-prev-bottom']){const node=q(`[${attr}]`,gallery);if(node)node.disabled=page<=1};for(const attr of ['data-page-next','data-page-next-bottom']){const node=q(`[${attr}]`,gallery);if(node)node.disabled=page>=pages}}
    qa('[data-product-gallery]').forEach(gallery=>{updateGallery(gallery);q('[data-gallery-sort]',gallery).addEventListener('change',()=>updateGallery(gallery,{reset:true}));for(const attr of ['data-page-prev','data-page-prev-bottom'])q(`[${attr}]`,gallery).addEventListener('click',()=>{gallery.dataset.page=String(Number(gallery.dataset.page)-1);updateGallery(gallery);window.scrollTo({top:gallery.getBoundingClientRect().top+window.scrollY-110,behavior:'smooth'})});for(const attr of ['data-page-next','data-page-next-bottom'])q(`[${attr}]`,gallery).addEventListener('click',()=>{gallery.dataset.page=String(Number(gallery.dataset.page)+1);updateGallery(gallery);window.scrollTo({top:gallery.getBoundingClientRect().top+window.scrollY-110,behavior:'smooth'})})});
    const search=q('#search');if(search)search.addEventListener('input',()=>{const term=search.value.trim().toLowerCase(),active=q('[data-view]:not([hidden])');qa('.searchable',active).filter(node=>!node.closest('[data-product-gallery]')).forEach(node=>node.classList.toggle('hidden',Boolean(term)&&!node.textContent.toLowerCase().includes(term)));qa('[data-product-gallery]',active).forEach(gallery=>updateGallery(gallery,{reset:true}))});
    q('#menuToggle').addEventListener('click',()=>q('#sidebar').classList.toggle('open'));document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'&&search){event.preventDefault();search.focus()}if(event.key==='Escape')q('#sidebar').classList.remove('open')});
    function syncProductImageAspect(image){if(!image.naturalWidth||!image.naturalHeight)return;const media=image.closest('.product-media');if(!media)return;media.style.setProperty('--product-image-aspect',`${image.naturalWidth}/${image.naturalHeight}`);media.dataset.imageAspect=`${image.naturalWidth}:${image.naturalHeight}`}
    qa('.product-media img').forEach(image=>{if(image.complete&&image.naturalWidth)syncProductImageAspect(image);else image.addEventListener('load',()=>syncProductImageAspect(image),{once:true})});
    qa('img[data-remote-image]').forEach(image=>image.addEventListener('error',()=>{image.hidden=true;const fallback=image.nextElementSibling;if(fallback)fallback.hidden=false},{once:true}));
    function syncTopbarHeight(){const topbar=q('.topbar');if(topbar)document.documentElement.style.setProperty('--actual-topbar',`${topbar.offsetHeight}px`)}syncTopbarHeight();window.addEventListener('resize',syncTopbarHeight);if(window.ResizeObserver)new ResizeObserver(syncTopbarHeight).observe(q('.topbar'));
    window.commerceUI={contract:'__CONTRACT__',version:'__CLI_VERSION__',viewIds,showView,activateTab,visibleViews:()=>qa('[data-view]').filter(v=>!v.hidden).map(v=>v.dataset.view)};
  </script>
</body>
